<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tower of Hanoi Experiment</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
}

.hidden {
  display: none;
}

#game {
  display: flex;
  justify-content: center;
  margin-top: 40px;
}

.peg {
  width: 120px;
  height: 300px;
  border: 2px solid black;
  margin: 0 20px;
  position: relative;
}

.disk {
  height: 20px;
  position: absolute;
  left: 0;
  right: 0;
  margin: auto;
  border-radius: 10px;
  cursor: grab;
}
</style>
</head>
<body>

<div id="instructions">
  <h2>Instructions</h2>
  <p id="instructionText"></p>
  <button id="startBtn">Start</button>
</div>

<div id="gameScreen" class="hidden">
  <h2>Solve the Puzzle</h2>
  <p>Moves: <span id="moves">0</span></p>
  <div id="game"></div>
</div>

<div id="endScreen" class="hidden">
  <h2>Finished</h2>
  <p>Thank you for completing the task.</p>
</div>

<script>
let group = {};
let moves = 0;
let startTime;
let numDiscs;
let pegs = [[], [], []];
let dragged = null;

function assignGroup() {
  return {
    pressure: Math.random() < 0.5 ? "pressure" : "neutral",
    difficulty: Math.random() < 0.5 ? "easy" : "hard"
  };
}

function setInstructions() {
  const el = document.getElementById("instructionText");

  const rules = `
    In this puzzle, you must move all blocks from the left box to the right box.<br><br>
    <strong>Rules:</strong><br>
    • Only one block may be moved at a time.<br>
    • A larger block cannot be placed on a smaller block.<br><br>
  `;

  let prompt;

  if (group.pressure === "pressure") {
    prompt = "This is a test of intelligence. Many people struggle with this task. Complete it as quickly and accurately as possible.";
  } else {
    prompt = "Please complete the puzzle as quickly and accurately as possible.";
  }

  el.innerHTML = rules + prompt;
}

function startExperiment() {
  document.getElementById("instructions").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");

  startTime = Date.now();
  initGame();
}

function initGame() {
  numDiscs = group.difficulty === "easy" ? 3 : 4;
  moves = 0;
  pegs = [[], [], []];

  document.getElementById("moves").innerText = moves;

  for (let i = numDiscs; i >= 1; i--) {
    pegs[0].push(i);
  }

  render();
}

function render() {
  const game = document.getElementById("game");
  game.innerHTML = "";

  pegs.forEach((peg, pegIndex) => {
    const pegDiv = document.createElement("div");
    pegDiv.className = "peg";
    pegDiv.dataset.index = pegIndex;

    peg.forEach((disk, i) => {
      const diskDiv = document.createElement("div");
      diskDiv.className = "disk";
      diskDiv.style.width = (disk * 30) + "px";
      diskDiv.style.bottom = (i * 22) + "px";
      diskDiv.style.background = "green";
      diskDiv.draggable = true;
      diskDiv.dataset.size = disk;
      diskDiv.dataset.peg = pegIndex;

      diskDiv.addEventListener("dragstart", (e) => {
        dragged = {
          size: parseInt(e.target.dataset.size),
          from: parseInt(e.target.dataset.peg)
        };
      });

      pegDiv.appendChild(diskDiv);
    });

    pegDiv.addEventListener("dragover", (e) => e.preventDefault());

    pegDiv.addEventListener("drop", (e) => {
      const to = parseInt(e.currentTarget.dataset.index);

      const fromPeg = pegs[dragged.from];
      const toPeg = pegs[to];

      if (fromPeg[fromPeg.length - 1] !== dragged.size) return;
      if (toPeg.length && toPeg[toPeg.length - 1] < dragged.size) return;

      fromPeg.pop();
      toPeg.push(dragged.size);

      moves++;
      document.getElementById("moves").innerText = moves;

      render();
      checkWin();
    });

    game.appendChild(pegDiv);
  });
}

function checkWin() {
  if (pegs[2].length === numDiscs) {
    const timeTaken = Date.now() - startTime;
    saveData(timeTaken);

    document.getElementById("gameScreen").classList.add("hidden");
    document.getElementById("endScreen").classList.remove("hidden");
  }
}

function saveData(timeTaken) {
  const data = {
    pressure: group.pressure,
    difficulty: group.difficulty,
    time: timeTaken,
    moves: moves
  };

  fetch("https://script.google.com/macros/s/AKfycbxDNNCY2IH8K3sVdsHLB6HY5oXBE5_o0je0ydUR7d60N7kvNfRoZbY1ja5oUOSOZ7T74w/exec", {
    method: "POST",
    body: JSON.stringify(data)
  }).catch(err => console.error(err));

  let backup = JSON.parse(localStorage.getItem("hanoiData") || "[]");
  backup.push(data);
  localStorage.setItem("hanoiData", JSON.stringify(backup));
}

window.onload = function() {
  console.log("Page loaded");

  group = assignGroup();
  setInstructions();

  document.getElementById("startBtn").addEventListener("click", startExperiment);
};
</script>

</body>
</html>
