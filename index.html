<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tower of Hanoi Experiment</title>
<style>
body { font-family: Arial, sans-serif; text-align: center; }
.hidden { display: none; }
#game { display: flex; justify-content: center; margin-top: 40px; }
.peg { width: 120px; height: 300px; border: 2px solid black; margin: 0 20px; position: relative; }
.disk { height: 20px; position: absolute; left: 0; right: 0; margin: auto; border-radius: 10px; cursor: grab; }
</style>
</head>
<body>

<div id="instructions">
  <h2>Instructions</h2>
  <p id="instructionText"></p>
  <button id="startBtn">Start</button>
</div>

<div id="gameScreen" class="hidden">
  <h2>Solve the Puzzle</h2>
  <p>Moves: <span id="moves">0</span></p>
  <div id="game"></div>
</div>

<div id="endScreen" class="hidden">
  <h2>Finished</h2>
  <p>Thank you for completing the task.</p>
</div>

<script>
let group = {};
let moves = 0;
let startTime;
let numDiscs;
let pegs = [[], [], []];

function assignGroup() {
  const pressure = Math.random() < 0.5 ? "pressure" : "neutral";
  const difficulty = Math.random() < 0.5 ? "easy" : "hard";
  return { pressure, difficulty };
}

function setInstructions() {
  const text = document.getElementById("instructionText");

  let baseRules = `In this puzzle, you must move all blocks from the left box to the right box.<br><br>
  <strong>Rules:</strong><br>
  • You may only move one block at a time.<br>
  • A larger block may never be placed on top of a smaller block.<br><br>`;

  let prompt = "";

  if (group.pressure === "pressure") {
    prompt = "This task is used as a measure of intelligence. Many people struggle with this puzzle. Try to complete it as quickly and accurately as possible.";
  } else {
    prompt = "Please complete the puzzle as quickly and accurately as possible.";
  }

  text.innerHTML = baseRules + prompt;
}

function startExperiment() {
  document.getElementById("instructions").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  startTime = Date.now();
  initGame();
}

function initGame() {
  numDiscs = group.difficulty === "easy" ? 3 : 4;
  pegs = [[], [], []];
  moves = 0;
  document.getElementById("moves").innerText = moves;

  for (let i = numDiscs; i >= 1; i--) {
    pegs[0].push(i);
  }
  render();
}

function render() {
  const game = document.getElementById("game");
  game.innerHTML = "";

  pegs.forEach((peg, pegIndex) => {
    const pegDiv = document.createElement("div");
    pegDiv.className = "peg";
    pegDiv.dataset.index = pegIndex;

    peg.forEach((disk, i) => {
      const diskDiv = document.createElement("div");
      diskDiv.className = "disk";
      diskDiv.style.width = (disk * 30) + "px";
      diskDiv.style.bottom = (i * 22) + "px";
      diskDiv.style.background = "green";
      diskDiv.draggable = true;
      diskDiv.dataset.size = disk;
      diskDiv.dataset.peg = pegIndex;

      diskDiv.addEventListener("dragstart", dragStart);
      pegDiv.appendChild(diskDiv);
    });

    pegDiv.addEventListener("dragover", e => e.preventDefault());
    pegDiv.addEventListener("drop", drop);
    game.appendChild(pegDiv);
  });
}

let dragged;

function dragStart(e) {
  dragged = {
    size: parseInt(e.target.dataset.size),
    from: parseInt(e.target.dataset.peg)
  };
}

function drop(e) {
  const to = parseInt(e.currentTarget.dataset.index);
  const fromPeg = pegs[dragged.from];
  const toPeg = pegs[to];

  if (fromPeg[fromPeg.length - 1] !== dragged.size) return;
  if (toPeg.length && toPeg[toPeg.length - 1] < dragged.size) return;

  fromPeg.pop();
  toPeg.push(dragged.size);
  moves++;
  document.getElementById("moves").innerText = moves;

  render();
  checkWin();
}

function checkWin() {
  if (pegs[2].length === numDiscs) {
    const timeTaken = Date.now() - startTime;
    saveData(timeTaken);

    document.getElementById("gameScreen").classList.add("hidden");
    document.getElementById("endScreen").classList.remove("hidden");
  }
}

function saveData(timeTaken) {
  const data = {
    pressure: group.pressure,
    difficulty: group.difficulty,
    time: timeTaken,
    moves: moves
  };

  fetch("https://script.google.com/macros/s/AKfycbznKicoh3kpTJt5GtTMtSddO5wUNw7mnBr8Xd02vJcfU9QBkDgbVmMViZLJp50S386ROQ/exec", {
    method: "POST",
    body: JSON.stringify(data),
    headers: {
      "Content-Type": "application/json"
    }
  }).catch(err => console.error(err));

  // Optional local backup
  let allData = JSON.parse(localStorage.getItem("hanoiData") || "[]");
  allData.push(data);
  localStorage.setItem("hanoiData", JSON.stringify(allData));
};

  fetch("https://script.google.com/macros/s/AKfycbznKicoh3kpTJt5GtTMtSddO5wUNw7mnBr8Xd02vJcfU9QBkDgbVmMViZLJp50S386ROQ/exec", {
    method: "POST",
    body: JSON.stringify(data),
    headers: {
      "Content-Type": "application/json"
    }
  }).catch(err => console.error(err));
};

  let allData = JSON.parse(localStorage.getItem("hanoiData") || "[]");
  allData.push(data);
  localStorage.setItem("hanoiData", JSON.stringify(allData));
}

// Initialize AFTER page loads
window.onload = function() {
  try {
    group = assignGroup();
    setInstructions();

    // Attach button handler safely
    document.getElementById("startBtn").addEventListener("click", startExperiment);

    console.log("Instructions loaded", group);
  } catch (e) {
    console.error("Init error:", e);
  }
};
